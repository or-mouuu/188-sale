name: 重建前台網站

# 後台按下「發佈到前台」會改寫 data/data.json，這裡接手把網站重建好。
on:
  push:
    paths:
      - 'data/data.json'
      - 'build/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:        # 也可以在 Actions 頁面手動按一下重跑

# 同一時間只跑一個，但「排隊中」的不取消。
# cancel-in-progress: true 會連 queued 的 run 一起砍掉；遇到 GitHub 排隊
# 塞車（曾經等 15 分鐘）時，使用者因為看不到變化而再按一次發佈，就會把
# 正要開始的那次取消，永遠輪不到執行。改成排隊執行，雖然可能多跑幾次，
# 但每次都是從當下的 data.json 重建，結果一致，而且一定會完成。
concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 需要把產生的 index.html 與照片寫回 repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝影像處理套件
        run: pip install --quiet Pillow pillow-heif

      - name: 重建網站
        run: python3 build/build_site.py

      - name: 有變動就 commit 回來
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html photos build/items.json build/photomap.json build/photos-files.json
          if git diff --cached --quiet; then
            echo "網站內容沒有變化，不需要 commit。"
          else
            git commit -m "自動重建前台網站（來自後台發佈）"
            git push
          fi
