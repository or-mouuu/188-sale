name: 重建前台網站

# 後台按下「發佈到前台」會改寫 data/data.json，這裡接手把網站重建好。
on:
  push:
    paths:
      - 'data/data.json'
      - 'build/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:        # 也可以在 Actions 頁面手動按一下重跑

# 同一時間只跑一個，連續按發佈時只有最後一次會完整跑完
concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 需要把產生的 index.html 與照片寫回 repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝影像處理套件
        run: pip install --quiet Pillow pillow-heif

      - name: 重建網站
        run: python3 build/build_site.py

      - name: 有變動就 commit 回來
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html photos build/items.json build/photomap.json build/photos-files.json
          if git diff --cached --quiet; then
            echo "網站內容沒有變化，不需要 commit。"
          else
            git commit -m "自動重建前台網站（來自後台發佈）"
            git push
          fi
