<title>青年路二手拍盤點</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="css">
:root{
  --ground:#F3F5F1; --surface:#FFFFFF; --surface-2:#FAFBF8;
  --ink:#17211E; --ink-2:#3E4A46; --muted:#727C77;
  --line:#DCE1DA; --line-2:#EDF0EA;
  --accent:#1E5A61; --accent-soft:#DCEBEB;
  --ok:#3A7554; --ok-bg:#E4EFE7;
  --warn:#96690F; --warn-bg:#F6EDD7;
  --alert:#B15827; --alert-bg:#F8E7DB;
  --crit:#9B3244; --crit-bg:#F8E1E4;
  --shadow:0 1px 2px rgba(23,33,30,.05), 0 8px 24px -16px rgba(23,33,30,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111614; --surface:#181F1D; --surface-2:#1D2523;
    --ink:#E7EBE5; --ink-2:#B6BFB9; --muted:#8B958F;
    --line:#2A3330; --line-2:#222B28;
    --accent:#79B8BC; --accent-soft:#1D3437;
    --ok:#7BBE95; --ok-bg:#1B2E23;
    --warn:#DDB25A; --warn-bg:#2F2716;
    --alert:#E39163; --alert-bg:#332115;
    --crit:#E4899A; --crit-bg:#31191E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#111614; --surface:#181F1D; --surface-2:#1D2523;
  --ink:#E7EBE5; --ink-2:#B6BFB9; --muted:#8B958F;
  --line:#2A3330; --line-2:#222B28;
  --accent:#79B8BC; --accent-soft:#1D3437;
  --ok:#7BBE95; --ok-bg:#1B2E23;
  --warn:#DDB25A; --warn-bg:#2F2716;
  --alert:#E39163; --alert-bg:#332115;
  --crit:#E4899A; --crit-bg:#31191E;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px; margin:0 auto; padding:0 20px}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.boot{padding:80px 20px; text-align:center; color:var(--muted);
  font-family:"IBM Plex Mono",monospace; font-size:13px}

/* ---- masthead ---- */
header.top{background:var(--surface); border-bottom:1px solid var(--line); padding:34px 0 0}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--accent); margin:0 0 10px}
h1{font-family:"Noto Serif TC",Georgia,serif; font-weight:700;
  font-size:clamp(28px,4.6vw,44px); line-height:1.2; margin:0 0 10px;
  text-wrap:balance; letter-spacing:-.01em}
.lede{max-width:60ch; color:var(--ink-2); margin:0 0 22px; font-size:14.5px}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
  gap:1px; background:var(--line); border-top:1px solid var(--line)}
.stat{background:var(--surface); padding:15px 20px}
.stat .k{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--muted); display:block; margin-bottom:3px}
.stat .v{font-family:"Noto Serif TC",Georgia,serif; font-size:29px; font-weight:700;
  line-height:1.1; font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px; font-weight:400; color:var(--muted); margin-left:3px}
.stat.s-ok .v{color:var(--ok)} .stat.s-alert .v{color:var(--alert)} .stat.s-warn .v{color:var(--warn)}
.stat.s-sold .v{color:var(--muted)}

/* ---- controls ---- */
.controls{position:sticky; top:0; z-index:20; background:var(--surface);
  border-bottom:1px solid var(--line); padding:11px 0}
.ctl-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.ctl-row + .ctl-row{margin-top:8px}
.ctl-label{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--muted); margin-right:2px; min-width:42px}
button.chip{font:inherit; font-size:13px; cursor:pointer; padding:5px 12px; border-radius:999px;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2);
  transition:background .12s, border-color .12s, color .12s}
button.chip:hover{border-color:var(--accent); color:var(--accent)}
button.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--ground)}
button.chip .n{font-family:"IBM Plex Mono",monospace; font-size:11px; opacity:.65; margin-left:5px}
button.chip.st-ok[aria-pressed="true"]{background:var(--ok); border-color:var(--ok)}
button.chip.st-warn[aria-pressed="true"]{background:var(--warn); border-color:var(--warn)}
button.chip.st-alert[aria-pressed="true"]{background:var(--alert); border-color:var(--alert)}
button.chip.st-crit[aria-pressed="true"]{background:var(--crit); border-color:var(--crit)}
button.chip.st-sold[aria-pressed="true"]{background:var(--muted); border-color:var(--muted)}
input.search{font:inherit; font-size:13px; padding:6px 12px; border-radius:999px; min-width:180px;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink)}
input.search:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
.spacer{margin-left:auto}
.count{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted)}
button.act{font:inherit; font-size:13px; cursor:pointer; padding:5px 13px; border-radius:999px;
  border:1px solid var(--accent); background:var(--accent); color:var(--ground); font-weight:500}
button.act:hover{filter:brightness(1.1)}
button.act.ghost{background:transparent; color:var(--accent)}
button.act.ghost:hover{background:var(--accent-soft); filter:none}
button.act[disabled]{opacity:.45; cursor:not-allowed}

/* ---- sections ---- */
main{padding:30px 0 60px}
.cat{margin-bottom:32px; scroll-margin-top:100px}
.cat-head{display:flex; align-items:baseline; gap:10px; padding-bottom:8px;
  border-bottom:2px solid var(--ink); margin-bottom:14px}
.cat-head h2{font-family:"Noto Serif TC",Georgia,serif; font-size:20px; font-weight:700; margin:0}
.cat-head .c{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--muted)}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(312px,1fr)); gap:12px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:3px;
  border-left:4px solid var(--line); padding:13px 15px 12px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:9px; text-align:left; font:inherit;
  cursor:pointer; color:inherit; width:100%;
  transition:border-color .12s, transform .12s}
.card:hover{border-color:var(--accent)}
.card:active{transform:translateY(1px)}
.card.ok{border-left-color:var(--ok)}
.card.warn{border-left-color:var(--warn)}
.card.alert{border-left-color:var(--alert)}
.card.crit{border-left-color:var(--crit)}
/* 已售出：整張淡掉，品名劃線，不再是「待處理」的顏色 */
.card.sold{border-left-color:var(--muted); background:var(--surface-2)}
.card.sold .card-top h3{text-decoration:line-through; text-decoration-thickness:1px;
  text-underline-offset:2px; color:var(--muted)}
.card.sold dl.spec, .card.sold .note, .card.sold .needs{opacity:.55}
.card-top{display:flex; gap:10px; align-items:flex-start; justify-content:space-between}
.card h3{font-size:15.5px; font-weight:700; margin:0; line-height:1.4;
  text-wrap:balance; flex:1 1 auto; min-width:0}
.idx{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted); flex:none; padding-top:3px}
.badge{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em;
  padding:2px 7px; border-radius:2px; white-space:nowrap; flex:none}
.badge.ok{background:var(--ok-bg); color:var(--ok)}
.badge.warn{background:var(--warn-bg); color:var(--warn)}
.badge.alert{background:var(--alert-bg); color:var(--alert)}
.badge.crit{background:var(--crit-bg); color:var(--crit)}
.badge.sold{background:var(--line-2); color:var(--muted)}
dl.spec{display:grid; grid-template-columns:auto 1fr; gap:2px 10px; margin:0; font-size:13px}
dl.spec dt{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted); padding-top:3px; white-space:nowrap}
dl.spec dd{margin:0; color:var(--ink-2); font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere}
.price{color:var(--ink); font-weight:700}
dd.linked{color:var(--accent)}
dd.cover{font-family:"IBM Plex Mono",monospace; font-size:12px}
.needs{display:flex; flex-wrap:wrap; gap:5px; align-items:center}
.need-label{font-family:"IBM Plex Mono",monospace; font-size:10.5px;
  letter-spacing:.1em; color:var(--muted)}
.need{font-size:11.5px; padding:1.5px 7px; border-radius:2px;
  background:var(--warn-bg); color:var(--warn)}
.need.photo{background:var(--alert-bg); color:var(--alert)}
.foot{display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding-top:8px; border-top:1px solid var(--line-2); font-size:12.5px}
.foot a{color:var(--accent); text-decoration:none; font-weight:500;
  border-bottom:1px solid var(--accent-soft); padding-bottom:1px}
.foot a:hover{border-bottom-color:var(--accent)}
.ph-link{color:var(--accent); font-weight:500; cursor:pointer}
.ph-link:hover{text-decoration:underline}
.nophoto{color:var(--alert); font-family:"IBM Plex Mono",monospace; font-size:11.5px}
.editcue{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted)}
.note{font-size:12.5px; color:var(--muted); line-height:1.55; white-space:pre-line;
  padding:7px 10px; background:var(--surface-2); border-radius:2px}
.note.flag{background:var(--crit-bg); color:var(--crit)}
.empty{text-align:center; padding:60px 20px; color:var(--muted);
  font-family:"IBM Plex Mono",monospace; font-size:13px}

/* ---- conflicts ---- */
.conflicts{border-top:1px solid var(--line); padding-top:32px; margin-top:6px; scroll-margin-top:100px}
.conflicts h2{font-family:"Noto Serif TC",Georgia,serif; font-size:22px; margin:0 0 6px}
.conflicts p.sub{color:var(--ink-2); margin:0 0 18px; max-width:62ch; font-size:14px}
ul.iss{list-style:none; margin:0; padding:0; display:grid; gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:3px; overflow:hidden}
ul.iss li{background:var(--surface); padding:13px 16px; display:grid; gap:5px;
  grid-template-columns:26px minmax(110px,168px) 1fr; align-items:start}
ul.iss li.done{opacity:.45}
ul.iss li.done .t, ul.iss li.done .b{text-decoration:line-through}
ul.iss .tick{appearance:none; width:17px; height:17px; margin-top:4px; border-radius:3px;
  border:1.5px solid var(--line); background:var(--surface-2); cursor:pointer}
ul.iss .tick:checked{background:var(--ok); border-color:var(--ok)}
ul.iss .t{font-weight:700; font-size:14.5px}
ul.iss .b{color:var(--ink-2); font-size:13.5px}
ul.iss .fix{grid-column:3; font-size:13px; color:var(--accent);
  padding-left:13px; border-left:2px solid var(--accent-soft)}
@media (max-width:640px){
  ul.iss li{grid-template-columns:26px 1fr}
  ul.iss .fix{grid-column:2}
}

/* ---- editor ---- */
dialog.editor{border:none; padding:0; border-radius:4px; max-width:560px; width:calc(100% - 32px);
  background:var(--surface); color:var(--ink); box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
dialog.editor::backdrop{background:rgba(10,16,14,.55)}
.ed-head{padding:18px 22px 14px; border-bottom:1px solid var(--line)}
.ed-head h2{font-family:"Noto Serif TC",Georgia,serif; font-size:19px; margin:0}
.ed-head p{margin:4px 0 0; font-size:12.5px; color:var(--muted)}
.ed-body{padding:16px 22px; display:grid; gap:12px; max-height:60vh; overflow-y:auto}
.fld{display:grid; gap:4px}
.fld label{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted)}
.fld label .req{color:var(--alert); margin-left:4px}
.fld input, .fld textarea, .fld select{font:inherit; font-size:14px; padding:7px 10px;
  border:1px solid var(--line); border-radius:3px; background:var(--surface-2); color:var(--ink); width:100%}
.fld textarea{resize:vertical; min-height:58px}
.fld .hint{font-size:11.5px; color:var(--muted)}
.two{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
/* 已售出開關 */
.soldbar{display:flex; align-items:center; gap:12px; padding:11px 13px; border-radius:3px;
  background:var(--surface-2); border:1px solid var(--line)}
.soldbar input{appearance:none; width:42px; height:24px; border-radius:999px; flex:none;
  background:var(--line); position:relative; cursor:pointer; transition:background .15s;
  border:none; padding:0; margin:0}
.soldbar input::after{content:""; position:absolute; top:3px; left:3px; width:18px; height:18px;
  border-radius:50%; background:var(--surface); transition:transform .15s}
.soldbar input:checked{background:var(--ok)}
.soldbar input:checked::after{transform:translateX(18px)}
.soldbar .txt{display:grid; gap:1px}
.soldbar .lbl{font-size:14px; font-weight:500}
.soldbar .sub{font-size:11.5px; color:var(--muted)}
.ed-foot{padding:13px 22px; border-top:1px solid var(--line);
  display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.ed-foot .msg{font-size:12.5px; color:var(--muted); margin-left:auto}
.ed-foot .msg.err{color:var(--crit)}
button.danger{font:inherit; font-size:13px; cursor:pointer; padding:5px 12px; border-radius:999px;
  border:1px solid var(--line); background:transparent; color:var(--crit)}
button.danger:hover{background:var(--crit-bg)}
.ro-note{padding:9px 14px; background:var(--warn-bg); color:var(--warn);
  font-size:12.5px; border-radius:3px; margin-bottom:14px}

footer.end{border-top:1px solid var(--line); padding:22px 0 50px; color:var(--muted);
  font-size:12.5px; line-height:1.7}
footer.end a{color:var(--accent)}
footer.end .rules{margin-top:10px; display:grid; gap:4px}
footer.end code{font-family:"IBM Plex Mono",monospace; font-size:11.5px;
  background:var(--surface-2); padding:1px 5px; border-radius:2px; color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

相近，只有除濕機1 有照片。","f":"一起入鏡並貼標籤，避免買家搞混。","done":false},{"t":"餅乾模具","b":"Drive 裡有一個空的「餅乾模具」資料夾，照片其實放在外層。","f":"把照片移進資料夾，或把空資料夾刪掉。","done":true},{"t":"微波爐／烤箱／電磁爐","b":"舊機要出清，採購清單另外編了微波爐 8,000、烤箱 10,000 的預算。","f":"沒有衝突，但交貨時間要排在新機到貨之後。","done":false}],"updated":"2026-08-28"}</script>
<script id="app">
const HEAD = '<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">'
  + '<title>青年路二手拍盤點<\/title>'
  + '<link rel="preconnect" href="https://fonts.googleapis.com">'
  + '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
  + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=IBM+Plex+Mono:wght@400;500&display=swap">';

const D = JSON.parse(document.getElementById('data').textContent);
const REQ = [['m','品牌／型號'],['s','規格／尺寸'],
             ['sell','售價'],['when','可搬走時間']];
const SEVC = {ok:'ok', warn:'warn', alert:'alert', crit:'crit', sold:'sold'};
const ST = {ok:'完整', warn:'缺資訊', alert:'缺照片',
            crit:'缺照片＋缺資訊', sold:'已售出'};

let api = null, canWrite = false, fCat = 'all', fSt = 'all', fQ = '', dirty = false;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const missOf = d => REQ.filter(([k]) => !String(d[k] || '').trim()).map(([, l]) => l);
function sevOf(d){
  if (d.sold) return 'sold';                        // 賣掉了就不再算它缺什麼
  const noP = !(d.ph > 0), noI = missOf(d).length > 0;
  return noP && noI ? 'crit' : noP ? 'alert' : noI ? 'warn' : 'ok';
}
const live = () => D.items.filter(d => !d.sold);

/* ---------- rendering ---------- */
function statsHTML(){
  const it = live();
  const ok = it.filter(d => sevOf(d) === 'ok').length;
  const np = it.filter(d => !(d.ph > 0)).length;
  const ni = it.filter(d => missOf(d).length).length;
  const sold = D.items.length - it.length;
  const cell = (k, v, cls, suf) =>
    `<div class="stat ${cls || ''}"><span class="k">${k}</span><span class="v">${v}${suf || ''}</span></div>`;
  return cell('品項總數', D.items.length)
    + cell('前台上架中', it.length)
    + cell('已售出', sold, 's-sold')
    + cell('可直接上架', ok, 's-ok')
    + cell('待補拍照片', np, 's-alert')
    + cell('待補欄位資訊', ni, 's-warn');
}

function chipsHTML(){
  const cnt = f => D.items.filter(f).length;
  const chip = (g, v, label, n, cls) =>
    `<button class="chip ${cls || ''}" data-g="${g}" data-v="${esc(v)}" aria-pressed="${
      (g === 'cat' ? fCat : fSt) === v}">${esc(label)}<span class="n">${n}<\/span><\/button>`;
  const cats = chip('cat', 'all', '全部', D.items.length)
    + D.cats.map(c => chip('cat', c, c, cnt(d => d.c === c))).join('');
  const sts = chip('st', 'all', '全部', D.items.length)
    + ['ok','warn','alert','crit','sold'].map(s =>
        chip('st', s, ST[s], cnt(d => sevOf(d) === s), 'st-' + s)).join('');
  return {cats, sts};
}

function cardHTML(d){
  const sev = sevOf(d), miss = d.sold ? [] : missOf(d);
  const row = (l, v, cls) => v ? `<dt>${l}<\/dt><dd class="${cls || ''}">${esc(v)}<\/dd>` : '';
  const spec = row('型號', d.m) + row('規格', d.s)
    + row('售價', d.sell, 'price') + row('原價', d.buy)
    + row('時間', d.when)
    + row('網址', d.link ? d.link.replace(/^https?:\/\//, '').slice(0, 46) : '', 'linked')
    + row('封面', d.cover, 'cover');
  const needs = miss.length
    ? `<div class="needs"><span class="need-label">還缺<\/span>${
        miss.map(m => `<span class="need">${esc(m)}<\/span>`).join('')}<\/div>` : '';
  const note = d.note
    ? `<div class="note${d.note.indexOf('⚠') === 0 ? ' flag' : ''}">${esc(d.note)}<\/div>` : '';
  const foot = d.ph > 0
    ? `<div class="foot"><span class="ph-link" data-url="${esc(d.url)}">看照片 ↗<\/span>
       <span class="editcue">${d.ph} 張 ・ 點一下編輯<\/span><\/div>`
    : `<div class="foot"><span class="nophoto">尚未拍照<\/span>
       <span class="editcue">點一下編輯<\/span><\/div>`;
  return `<button type="button" class="card ${SEVC[sev]}" data-id="${d.id}">
    <div class="card-top"><span class="idx">${String(d.id).padStart(2,'0')}<\/span>
      <h3>${esc(d.n)}<\/h3><span class="badge ${SEVC[sev]}">${ST[sev]}<\/span><\/div>
    ${spec ? `<dl class="spec">${spec}<\/dl>` : ''}${needs}${note}${foot}<\/button>`;
}

function listHTML(){
  const q = fQ.trim().toLowerCase();
  const rows = D.items.filter(d =>
    (fCat === 'all' || d.c === fCat) &&
    (fSt === 'all' || sevOf(d) === fSt) &&
    (!q || (d.n + d.m + d.s + d.note + d.c).toLowerCase().includes(q)));
  let out = '';
  for (const c of D.cats){
    const sub = rows.filter(d => d.c === c);
    if (!sub.length) continue;
    const np = sub.filter(d => !d.sold && !(d.ph > 0)).length;
    const ns = sub.filter(d => d.sold).length;
    const tags = [np ? `${np} 項待拍照` : '', ns ? `${ns} 項已售出` : ''].filter(Boolean);
    out += `<section class="cat"><div class="cat-head"><h2>${esc(c)}<\/h2>
      <span class="c">${sub.length} 項${tags.length ? ' ・ ' + tags.join(' ・ ') : ''}<\/span><\/div>
      <div class="grid">${sub.map(cardHTML).join('')}<\/div><\/section>`;
  }
  return {html: out || '<p class="empty">沒有符合條件的品項。<\/p>',
          n: rows.length};
}

function issuesHTML(){
  return D.issues.map((s, i) =>
    `<li class="${s.done ? 'done' : ''}"><input class="tick" type="checkbox" data-i="${i}"
       ${s.done ? 'checked' : ''} ${canWrite ? '' : 'disabled'}
       aria-label="標記已處理：${esc(s.t)}">
     <span class="t">${esc(s.t)}<\/span><span class="b">${esc(s.b)}<\/span>
     <span class="fix">${esc(s.f)}<\/span><\/li>`).join('');
}

function shellHTML(){
  const {cats, sts} = chipsHTML();
  const L = listHTML();
  const roNote = canWrite ? '' :
    `<div class="wrap"><div class="ro-note">目前是只讀模式，編輯後不會被儲存。<\/div><\/div>`;
  return `<header class="top">
    <div class="wrap">
      <p class="eyebrow">出清盤點 ・ 更新於 ${esc(D.updated)}<\/p>
      <h1>青年路搬家二手拍<\/h1>
      <p class="lede">把 Google Sheet 的出清清單和 Drive 的照片資料夾合起來看。
        卡片左側的顏色就是它離「可以上架」還差多遠。
        <strong>點任何一張卡片就能直接補資料<\/strong>，存檔後會自動存成新的一版。<\/p>
    <\/div>
    <div class="stats">${statsHTML()}<\/div>
  <\/header>
  <div class="controls"><div class="wrap">
    <div class="ctl-row"><span class="ctl-label">分類<\/span>${cats}<\/div>
    <div class="ctl-row"><span class="ctl-label">狀態<\/span>${sts}
      <input id="q" class="search" type="search" placeholder="搜尋品項、品牌、規格…"
        aria-label="搜尋品項" value="${esc(fQ)}">
      <span class="spacer"><\/span>
      <span class="count" id="count">顯示 ${L.n} / ${D.items.length} 項<\/span>
      ${canWrite ? '<button class="act ghost" id="add">＋ 新增品項<\/button>' : ''}
    <\/div>
  <\/div><\/div>
  ${roNote}
  <main class="wrap"><div id="list">${L.html}<\/div>
    <section class="conflicts">
      <h2>開始做網站之前，這幾件先確認<\/h2>
      <p class="sub">兩份資料互相打架、或是同一件東西被記了兩次的地方。處理完就勾起來。<\/p>
      <ul class="iss" id="iss">${issuesHTML()}<\/ul>
    <\/section>
  <\/main>
  <footer class="end"><div class="wrap">
    資料來源：
    <a href="https://docs.google.com/spreadsheets/d/1DvWjIy7WtkCWJJ1TP291hnVmpaWyzKXuRiyT4nVdIYQ/edit" target="_blank" rel="noopener">出清清單 Google Sheet<\/a>
    ・
    <a href="https://drive.google.com/drive/folders/1vdIQlWOaWGTyM2M1WwWyyHIpYoAiBikS" target="_blank" rel="noopener">照片 Drive 資料夾<\/a>
    ・
    <a href="https://claude.ai/code/artifact/e9dfb950-06d0-4a8b-b129-eaf990cc14bb" target="_blank" rel="noopener">買家看的前台<\/a>
    <div class="rules">
      <span>「缺資訊」的判定：品牌／型號、規格／尺寸、售價、可搬走時間這四項只要有一項空著就算。<\/span>
      <span>標成<strong>已售出<\/strong>的品項不會出現在前台，也不再計入待補統計。<\/span>
      <span>列表<strong>預覽圖<\/strong>：Drive 檔名裡含 <code>封面<\/code> 或 <code>cover<\/code>、或開頭是 <code>*<\/code> 的那張優先；都沒有就用資料夾裡的第一張。要指定別張時，把檔名填進「列表預覽圖」欄位。<\/span>
      <span>改完資料後，跟 Claude 說一聲就會重建前台。<\/span>
    <\/div>
  <\/div><\/footer>
  <dialog class="editor" id="ed"><\/dialog>`;
}

function render(){
  document.getElementById('root').innerHTML = shellHTML();
}

/* ---------- publishing ---------- */
function serialize(){
  const css = document.getElementById('css').textContent;
  const app = document.getElementById('app').textContent;
  const json = JSON.stringify(D).replace(/</g, '\\u003c');
  return '<!doctype html><html lang="zh-Hant"><head>' + HEAD
    + '<style id="css">' + css + '<\/style><\/head><body>'
    + '<script type="application/json" id="data">' + json + '<\/script>'
    + '<div id="root"><p class="boot">載入中…<\/p><\/div>'
    + '<script id="app">' + app + '<\/script><\/body><\/html>';
}

async function save(msgEl){
  if (!api){ return false; }
  try{
    if (msgEl){ msgEl.textContent = '儲存中…'; msgEl.className = 'msg'; }
    await api.publish(serialize());
    return true;
  }catch(e){
    const code = e && e.code;
    if (code === 'conflict') return true;           // 頁面會自動重新載入到最新版
    if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared'){
      canWrite = false; render();
      if (msgEl){ msgEl.textContent = '這個視窗沒有編輯權限。'; msgEl.className = 'msg err'; }
      return false;
    }
    if (msgEl){
      msgEl.textContent = code === 'rate_limited'
        ? '儲存太頻繁，請稍等幾秒再試。'
        : '儲存失敗，請再試一次。';
      msgEl.className = 'msg err';
    }
    return false;
  }
}

/* ---------- editor dialog ---------- */
const F = [
  ['n', '品項名稱', 'input', true, ''],
  ['c', '分類', 'select', true, ''],
  ['m', '品牌／型號', 'input', true, '例：宜得利 N STAIN 1680 BR、古物、無品牌'],
  ['s', '規格／尺寸', 'input', true, '例：80×40×160 cm、500ml、L 號、一組2只'],
  ['sell', '售價', 'input', true, '例：500、免費贈送、含於床組合售'],
  ['buy', '原購入價', 'input', false, '選填，例：3,490（2023.08）'],
  ['when', '可搬走時間', 'input', true, '例：現在可搬走、11月可搬走'],
  ['ph', '照片張數', 'number', false, '0 = 還沒拍'],
  ['url', '照片連結', 'input', false, 'Drive 資料夾或檔案的網址'],
  ['link', '商品參考網址', 'input', false, '選填。填了前台會出現「看這件商品的原始頁面」'],
  ['cover', '列表預覽圖', 'input', false,
   '選填。填 Drive 裡的檔名（例 IMG_5090.HEIC）指定哪張當預覽圖。留空的話，用檔名含「封面」或 cover、開頭是 * 的那張；再沒有就用第一張'],
  ['note', '備註', 'textarea', false, '寫給買家看的。內部提醒也可以寫，做前台時會過濾掉']
];

function openEditor(id){
  if (!canWrite) return;
  const dlg = document.getElementById('ed');
  const isNew = id == null;
  const d = isNew
    ? {id: Math.max(0, ...D.items.map(x => x.id)) + 1, c: D.cats[0], n: '', m: '', s: '',
       buy: '', sell: '', when: '', ph: 0, url: '', link: '', cover: '', note: '', sold: false}
    : D.items.find(x => x.id === id);
  if (!d) return;

  const field = ([k, label, type, req, hint]) => {
    const v = esc(d[k]);
    let ctl;
    if (type === 'select')
      ctl = `<select name="${k}">${D.cats.map(c =>
        `<option value="${esc(c)}"${c === d.c ? ' selected' : ''}>${esc(c)}<\/option>`).join('')}<\/select>`;
    else if (type === 'textarea') ctl = `<textarea name="${k}">${v}<\/textarea>`;
    else if (type === 'number') ctl = `<input name="${k}" type="number" min="0" value="${v}">`;
    else ctl = `<input name="${k}" type="text" value="${v}">`;
    return `<div class="fld"><label>${label}${req ? '<span class="req">必填<\/span>' : ''}<\/label>
      ${ctl}${hint ? `<span class="hint">${hint}<\/span>` : ''}<\/div>`;
  };
  const byKey = k => field(F.find(f => f[0] === k));

  dlg.innerHTML = `<form method="dialog" id="edform">
    <div class="ed-head">
      <h2>${isNew ? '新增品項' : esc(d.n)}<\/h2>
      <p>四個必填欄位都填完、且照片張數大於 0，狀態就會變成「完整」。<\/p>
    <\/div>
    <div class="ed-body">
      <label class="soldbar">
        <input type="checkbox" name="sold"${d.sold ? ' checked' : ''}>
        <span class="txt"><span class="lbl">已售出<\/span>
          <span class="sub">打開之後這件不會出現在買家看的前台<\/span><\/span>
      <\/label>
      ${byKey('n')}${byKey('c')}${byKey('m')}${byKey('s')}
      <div class="two">${byKey('sell')}${byKey('buy')}<\/div>
      ${byKey('when')}
      <div class="two">${byKey('ph')}${byKey('url')}<\/div>
      ${byKey('cover')}
      ${byKey('link')}
      ${byKey('note')}
    <\/div>
    <div class="ed-foot">
      <button class="act" type="submit" value="save">儲存<\/button>
      <button class="act ghost" type="button" data-x="cancel">取消<\/button>
      ${isNew ? '' : '<button class="danger" type="button" data-x="del">刪除這項<\/button>'}
      <span class="msg" id="edmsg"><\/span>
    <\/div><\/form>`;

  const msg = dlg.querySelector('#edmsg');
  dlg.querySelector('[data-x="cancel"]').onclick = () => dlg.close();
  const del = dlg.querySelector('[data-x="del"]');
  if (del) del.onclick = async () => {
    if (del.dataset.armed !== '1'){
      del.dataset.armed = '1';
      del.textContent = '再按一次確定刪除';
      return;
    }
    D.items = D.items.filter(x => x.id !== d.id);
    if (await save(msg)){ render(); dlg.close(); } else { render(); }
  };

  dlg.querySelector('#edform').onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const next = Object.assign({}, d);
    for (const f of F) next[f[0]] = String(fd.get(f[0]) ?? '').trim();
    next.ph = Math.max(0, parseInt(next.ph, 10) || 0);
    next.sold = fd.get('sold') != null;   // 沒勾的 checkbox 不會出現在 FormData
    next.id = d.id;
    if (!next.n){ msg.textContent = '品項名稱不能空白。'; msg.className = 'msg err'; return; }
    if (isNew) D.items.push(next);
    else D.items[D.items.findIndex(x => x.id === d.id)] = next;
    if (await save(msg)){ render(); dlg.close(); }
  };
  dlg.showModal();
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const chip = e.target.closest('button.chip');
  if (chip){
    if (chip.dataset.g === 'cat') fCat = chip.dataset.v; else fSt = chip.dataset.v;
    render(); return;
  }
  if (e.target.closest('#add')){ openEditor(null); return; }
  const link = e.target.closest('.ph-link');
  if (link){ e.stopPropagation(); window.open(link.dataset.url, '_blank', 'noopener'); return; }
  const card = e.target.closest('button.card');
  if (card){ openEditor(Number(card.dataset.id)); return; }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q'){
    fQ = e.target.value;
    const L = listHTML();
    document.getElementById('list').innerHTML = L.html;
    document.getElementById('count').textContent =
      `顯示 ${L.n} / ${D.items.length} 項`;
  }
});

document.addEventListener('change', async e => {
  const t = e.target.closest('.tick');
  if (!t || !canWrite) return;
  D.issues[Number(t.dataset.i)].done = t.checked;
  t.closest('li').classList.toggle('done', t.checked);
  await save(null);
});

render();

claude.use('artifact').then(a => {
  api = a;
  canWrite = !!a;
  render();
}).catch(() => {});
</script>
